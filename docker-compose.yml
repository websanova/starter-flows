services:
  flows:
    image: nginx:alpine
    container_name: starter-flows
    ports:
      - "8088:80"
    volumes:
      - ./viewer/index.html:/usr/share/nginx/html/index.html:ro
      - ./viewer/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./viewer/vendor:/usr/share/nginx/html/vendor:ro
      - ./viewer/favicons:/usr/share/nginx/html/favicons:ro
      - ./flows:/usr/share/nginx/html/flows:ro
      - ./docs:/usr/share/nginx/html/docs:ro
      - ./refs:/usr/share/nginx/html/refs:ro
    restart: unless-stopped
