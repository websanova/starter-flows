server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Everything is bind mounted and edited live. Never cache.
    add_header Cache-Control "no-store" always;

    # The sidebar is built from files.json, so these roots only ever serve a
    # single markdown file per request.
    location /flows/ {
        default_type text/markdown;
    }

    location /docs/ {
        default_type text/markdown;
    }

    location /refs/ {
        default_type text/markdown;
    }
}
