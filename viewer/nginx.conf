server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Everything is bind mounted and edited live. Never cache.
    add_header Cache-Control "no-store" always;

    # A request for /flows/ returns a JSON listing the viewer turns into its
    # sidebar. A request for /flows/<name>.md returns the file.
    location /flows/ {
        autoindex on;
        autoindex_format json;
        default_type text/markdown;
    }
}
