<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Starter Flows</title>
    <link rel="icon" href="/favicons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-icon-180x180.png">
    <link rel="manifest" href="/favicons/manifest.json">
    <style>
        :root {
            --bg: #ffffff;
            --fg: #1f2328;
            --muted: #59636e;
            --border: #d1d9e0;
            --code-bg: rgba(217, 119, 87, .10);
            --code-fg: #b3502f;
            --link: #0969da;
            --side-bg: #f6f8fa;
            --hover: #eaeef2;
            --float-bg: rgba(255, 255, 255, .72);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d1117;
                --fg: #e6edf3;
                --muted: #9198a1;
                --border: #3d444d;
                --code-bg: rgba(217, 119, 87, .14);
                --code-fg: #e79070;
                --link: #4493f8;
                --side-bg: #010409;
                --hover: #161b22;
                --float-bg: rgba(22, 27, 34, .72);
            }
        }

        * {
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--muted);
        }

        html, body {
            height: 100%;
        }

        body {
            display: flex;
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--fg);
            font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        /* Sidebar */

        aside {
            flex: 0 0 260px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background: var(--side-bg);
            border-right: 1px solid var(--border);
        }

        aside .top {
            display: flex;
            align-items: center;
            padding: 1rem 1.2rem;
        }

        aside .tabs {
            display: flex;
            gap: 1rem;
        }

        /* Drawer close. Mobile only, the drawer is the only thing it shuts. */

        #close {
            display: none;
            margin-left: auto;
            padding: 0;
            border: 0;
            background: none;
            cursor: pointer;
            color: var(--muted);
        }

        #close svg {
            display: block;
            width: 1rem;
            height: 1rem;
        }

        aside .tabs button {
            padding: 0;
            border: 0;
            background: none;
            cursor: pointer;
            font: inherit;
            font-size: .75rem;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
            opacity: .45;
        }

        aside .tabs button:hover {
            opacity: .75;
        }

        aside .tabs button.active {
            color: var(--link);
            opacity: 1;
        }

        nav .group {
            padding: .8rem 1.2rem .25rem;
            font-size: .7rem;
            font-weight: 600;
            letter-spacing: .04em;
            color: var(--muted);
            cursor: default;
            user-select: none;
        }

        nav a {
            display: flex;
            align-items: center;
            gap: .5rem;
            padding: .45rem 1.2rem;
            color: var(--fg);
            text-decoration: none;
            font-size: .7rem;
            border-left: 2px solid transparent;
        }

        nav a.nested {
            padding-left: 2rem;
        }

        nav a:hover {
            background: var(--hover);
        }

        nav a.active {
            background: var(--hover);
            border-left-color: var(--link);
            font-weight: 600;
        }

        nav a span.name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .badge {
            flex: none;
            padding: .05rem .4rem;
            border-radius: 999px;
            font-size: .7rem;
            font-weight: 600;
            letter-spacing: .03em;
            text-transform: uppercase;
            border: 1px solid;
        }

        .badge.wip {
            color: #9a6700;
            border-color: #d4a72c66;
            background: #d4a72c22;
        }

        .badge.draft {
            color: #9a6700;
            border-color: #d4a72c66;
            background: #d4a72c22;
        }

        .badge.ready {
            color: #0969da;
            border-color: #0969da66;
            background: #0969da22;
        }

        .badge.done {
            color: #1a7f37;
            border-color: #1a7f3766;
            background: #1a7f3722;
        }

        .badge.ref {
            color: #656d76;
            border-color: #656d7666;
            background: #656d7622;
        }

        @media (prefers-color-scheme: dark) {
            .badge.wip { color: #d29922; }
            .badge.draft { color: #d29922; }
            .badge.ready { color: #4493f8; }
            .badge.done { color: #3fb950; }
            .badge.ref { color: #8b949e; }
        }

        /* Content */

        main {
            flex: 1;
            overflow-y: auto;
            padding: 0 1.75rem 6rem;
        }

        main > :first-child {
            margin-top: 1.5rem;
        }

        h1, h2, h3 {
            line-height: 1.25;
            margin: 2rem 0 1rem;
        }

        main h1 {
            font-size: 1.9rem;
        }

        h2 {
            font-size: 1.45rem;
            padding-bottom: .3rem;
            border-bottom: 1px solid var(--border);
        }

        h3 {
            font-size: 1.15rem;
        }

        a {
            color: var(--link);
        }

        code {
            background: var(--code-bg);
            color: var(--code-fg);
            border-radius: 4px;
            padding: .15em .35em;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: .9em;
        }

        pre {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            overflow-x: auto;
        }

        /* A fenced block stays neutral. The accent is for picking one token out
           of a sentence, and a whole block tinted rust reads as an error. */
        pre code {
            background: none;
            color: var(--fg);
            padding: 0;
        }

        /* An identifier like invoice_settings.default_payment_method is one
           unbreakable token, and a nested list item is already narrow enough
           that it pushes the page sideways. Inline code only, prose is left
           alone. anywhere rather than break-word so a table cell stops
           demanding the whole token as its minimum width. */
        main :not(pre) > code {
            overflow-wrap: anywhere;
        }

        blockquote {
            margin: 1rem 0;
            padding-left: 1rem;
            border-left: 3px solid var(--border);
            color: var(--muted);
        }

        /* Tables and diagrams scroll inside their own box so the page never does. */
        .scroll-x {
            overflow-x: auto;
            margin: 1rem 0;
        }

        table {
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid var(--border);
            padding: .4rem .7rem;
            text-align: left;
        }

        pre.mermaid {
            background: none;
            border: 0;
            padding: 0;
            text-align: left;
            overflow-x: auto;
        }

        pre.mermaid svg {
            height: auto;
        }

        .error {
            margin-top: 1.5rem;
            border: 1px solid var(--border);
            border-left: 3px solid #d1242f;
            border-radius: 6px;
            padding: 1rem;
        }

        .empty {
            padding: 1.5rem 1.2rem;
            color: var(--muted);
            font-size: .875rem;
        }

        /* Drawer toggle. Fixed above the drawer so it can also close it. */

        #drawer {
            display: none;
            position: fixed;
            left: 1.25rem;
            bottom: calc(1.25rem + env(safe-area-inset-bottom));
            z-index: 30;
            align-items: center;
            justify-content: center;
            width: 2.75rem;
            height: 2.75rem;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--float-bg);
            backdrop-filter: blur(8px);
            color: var(--fg);
            cursor: pointer;
        }

        #drawer svg {
            width: 1.25rem;
            height: 1.25rem;
        }

        #backdrop {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10;
            background: rgba(0, 0, 0, .4);
        }

        body.drawer #backdrop {
            display: block;
        }

        @media (max-width: 768px) {
            #drawer,
            #close {
                display: flex;
            }

            aside {
                position: fixed;
                inset: 0 auto 0 0;
                width: 260px;
                max-height: none;
                z-index: 20;
                border-right: 1px solid var(--border);
                transform: translateX(-100%);
                transition: transform .2s;
            }

            body.drawer aside {
                transform: none;
            }

            main {
                padding-bottom: calc(7rem + env(safe-area-inset-bottom));
            }
        }

        @media (prefers-reduced-motion: reduce) {
            aside {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <aside>
        <div class="top">
            <div class="tabs" id="tabs"></div>

            <button id="close" type="button" aria-label="Close the file list">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M6 6l12 12M18 6L6 18"/>
                </svg>
            </button>
        </div>

        <nav id="nav"></nav>
    </aside>

    <main id="doc"></main>

    <div id="backdrop"></div>

    <button id="drawer" type="button" aria-label="Toggle the file list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <line x1="9" y1="4" x2="9" y2="20"/>
        </svg>
    </button>

    <script src="./vendor/marked.umd.js"></script>
    <script src="./vendor/mermaid.min.js"></script>

    <script type="module">
        const { marked } = window.marked;
        const mermaid = window.mermaid;

        const nav = document.getElementById('nav');
        const tabs = document.getElementById('tabs');
        const el = document.getElementById('doc');
        const drawer = document.getElementById('drawer');
        const backdrop = document.getElementById('backdrop');

        // Sidebar tabs. Each root is a top level directory served by nginx.
        const ROOTS = ['docs', 'flows', 'refs'];

        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        mermaid.initialize({
            startOnLoad: false,
            theme: dark ? 'dark' : 'default',
            themeVariables: { fontSize: '12px' },
            flowchart: { useMaxWidth: false, padding: 8, nodeSpacing: 40, rankSpacing: 60 },
            sequence: { useMaxWidth: false }
        });

        const POLL_MS = 2000;

        // Full path from the site root -> { mtime, status }, e.g. flows/subscriptions/stripe/create.md
        const meta = new Map();

        // Last root used and the last file open in each, so clicking between the
        // tabs and refreshing both land back where you were. Private browsing
        // makes localStorage throw rather than no-op, so every touch is guarded
        // and a failure just means the viewer forgets.
        const STORE = 'starter-flows:last';

        const readStore = () => {
            try {
                return JSON.parse(localStorage.getItem(STORE)) || {};
            }
            catch (e) {
                return {};
            }
        };

        const writeStore = patch => {
            try {
                localStorage.setItem(STORE, JSON.stringify({ ...readStore(), ...patch }));
            }
            catch (e) {
                // Storage unavailable. Nothing is remembered.
            }
        };

        let root = ROOTS.includes(readStore().root) ? readStore().root : ROOTS[0];
        let current = null;
        let busy = false;

        const slug = name => name.replace(/\.md$/, '');

        // PascalCase file names read as sentences in the sidebar. Two passes so
        // APIUser gives "API User" rather than "A P I User".
        const words = name => name
            .replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2')
            .replace(/([a-z0-9])([A-Z])/g, '$1 $2');

        const base = name => name.slice(name.lastIndexOf('/') + 1);

        const groupOf = name => name.slice(0, name.lastIndexOf('/'));

        const fail = (title, detail) => {
            el.innerHTML = '<div class="error"><strong>' + title + '</strong><p>' + detail + '</p></div>';
        };

        const readStatus = text => (text.match(/^Status:\s*(done|draft|ready|ref|wip)/mi) || [])[1] || '';

        const encodePath = path => path.split('/').map(encodeURIComponent).join('/');

        // The hash is the full path without .md, e.g. #flows/subscriptions/stripe/create
        // or #docs/terms. Its first segment picks the tab.
        const hashRoot = () => {
            const first = location.hash.slice(1).split('/')[0];

            return ROOTS.includes(first) ? first : null;
        };

        // Walks a root and every directory under it. Names come back as full
        // paths, e.g. flows/subscriptions/stripe/create-hosted.md.
        async function listDir (path) {
            const res = await fetch(encodePath(path), { cache: 'no-store' });

            if (! res.ok) {
                throw new Error(res.status + ' ' + res.statusText);
            }

            const out = [];

            for (const e of await res.json()) {
                if (e.type === 'directory') {
                    out.push(...await listDir(path + e.name + '/'));
                }
                else if (e.name.endsWith('.md')) {
                    out.push({ ...e, name: path + e.name });
                }
            }

            return out;
        }

        async function fetchIndex () {
            return (await listDir(root + '/')).sort((a, b) => {
                const ad = groupOf(a.name);
                const bd = groupOf(b.name);

                return ad === bd ? base(a.name).localeCompare(base(b.name)) : ad.localeCompare(bd);
            });
        }

        async function fetchDoc (name) {
            const res = await fetch(encodePath(name), { cache: 'no-store' });

            if (! res.ok) {
                throw new Error(res.status + ' ' + res.statusText);
            }

            return res.text();
        }

        function renderTabs () {
            tabs.innerHTML = '';

            for (const name of ROOTS) {
                const button = document.createElement('button');

                button.textContent = name;
                button.className = name === root ? 'active' : '';

                // Go straight to the file last open in that tab. Falling back to
                // the bare root name leaves sync() to pick the first file.
                button.onclick = () => {
                    if (name === root) {
                        return;
                    }

                    const last = readStore()[name];

                    root = name;
                    current = null;
                    writeStore({ root: name });
                    location.hash = last ? slug(last) : name;
                };

                tabs.appendChild(button);
            }
        }

        function renderNav (list) {
            nav.innerHTML = '';

            if (! list.length) {
                nav.innerHTML = '<p class="empty">Nothing in <code>' + root + '/</code> yet.</p>';

                return;
            }

            // List is sorted by full path, so files in a directory are contiguous.
            let group = null;

            for (const e of list) {
                const dir = groupOf(e.name);

                // The tab already names the root, so the heading drops it.
                const heading = dir === root ? '' : dir.slice(root.length + 1);

                if (dir !== group) {
                    group = dir;

                    if (heading) {
                        const head = document.createElement('div');

                        head.className = 'group';
                        head.textContent = heading.split('/').join(' / ');
                        nav.appendChild(head);
                    }
                }

                const a = document.createElement('a');

                a.href = '#' + slug(e.name);
                a.className = (e.name === current ? 'active' : '') + (heading ? ' nested' : '');

                const label = document.createElement('span');

                label.className = 'name';
                label.textContent = words(slug(base(e.name)));
                a.appendChild(label);

                const status = (meta.get(e.name) || {}).status;

                if (status) {
                    const badge = document.createElement('span');

                    badge.className = 'badge ' + status.toLowerCase();
                    badge.textContent = status;
                    a.appendChild(badge);
                }

                nav.appendChild(a);
            }
        }

        async function render (text, keepScroll) {
            const top = keepScroll ? el.scrollTop : 0;

            el.innerHTML = marked.parse(text);

            // marked emits <pre><code class="language-mermaid">, mermaid wants <pre class="mermaid">.
            el.querySelectorAll('pre > code.language-mermaid').forEach(code => {
                const pre = document.createElement('pre');

                pre.className = 'mermaid';
                pre.textContent = code.textContent;
                code.parentElement.replaceWith(pre);
            });

            el.querySelectorAll('table').forEach(table => {
                const wrap = document.createElement('div');

                wrap.className = 'scroll-x';
                table.replaceWith(wrap);
                wrap.appendChild(table);
            });

            el.scrollTop = top;

            await mermaid.run({ nodes: el.querySelectorAll('pre.mermaid') });

            el.scrollTop = top;
        }

        async function load (name, keepScroll) {
            current = name;
            document.title = 'Starter | ' + words(slug(base(name)));
            writeStore({ root: root, [root]: name });

            try {
                const text = await fetchDoc(name);

                meta.set(name, { ...(meta.get(name) || {}), status: readStatus(text) });

                await render(text, keepScroll);
            }
            catch (e) {
                fail('Could not load ' + name, e.message);
            }
        }

        async function sync (initial) {
            // A hash pointing at the other tab switches the tab before listing.
            root = hashRoot() || root;

            renderTabs();

            let list;

            try {
                list = await fetchIndex();
            }
            catch (e) {
                if (initial) {
                    fail('Could not list ' + root, e.message
                        + '<br>Check the container is up with <code>docker compose up -d</code> '
                        + 'and that a <code>' + root + '/</code> directory exists.');
                }

                return;
            }

            const names = new Set(list.map(e => e.name));
            const changed = [];

            for (const e of list) {
                const prev = meta.get(e.name);

                if (! prev || prev.mtime !== e.mtime) {
                    meta.set(e.name, { mtime: e.mtime, status: prev ? prev.status : '' });
                    changed.push(e.name);
                }
            }

            // Only prune the active root. The other tab's statuses stay cached.
            for (const name of [...meta.keys()]) {
                if (name.startsWith(root + '/') && ! names.has(name)) {
                    meta.delete(name);
                }
            }

            // Hash first so links and refreshes win, then the file last open in
            // this tab, then whatever is at the top of the list.
            const want = location.hash.slice(1) + '.md';
            const last = readStore()[root];
            const target = names.has(want) ? want
                : names.has(last) ? last
                : (list[0] ? list[0].name : null);

            if (! target) {
                current = null;
                document.title = 'Starter Flows';
                renderNav(list);
                el.innerHTML = '<p class="empty">Nothing in <code>' + root + '/</code> yet.</p>';

                return;
            }

            // Pull statuses for anything that changed but is not the open doc.
            // load() reads the status off the open doc for free.
            await Promise.all(changed.filter(n => n !== target).map(async name => {
                try {
                    meta.get(name).status = readStatus(await fetchDoc(name));
                }
                catch (e) {
                    // Listed but unreadable. Leave the badge blank.
                }
            }));

            if (target !== current || changed.includes(target)) {
                await load(target, target === current);
            }

            renderNav(list);
        }

        async function tick (initial) {
            if (busy) {
                return;
            }

            busy = true;

            try {
                await sync(initial);
            }
            finally {
                busy = false;
            }
        }

        // The drawer only exists below the breakpoint. Above it the class is
        // inert, so nothing needs to know which layout is showing.
        const closeDrawer = () => document.body.classList.remove('drawer');

        drawer.onclick = () => document.body.classList.toggle('drawer');
        backdrop.onclick = closeDrawer;
        document.getElementById('close').onclick = closeDrawer;
        nav.addEventListener('click', e => e.target.closest('a') && closeDrawer());

        window.addEventListener('keydown', e => e.key === 'Escape' && closeDrawer());

        window.addEventListener('hashchange', () => tick());

        await tick(true);

        setInterval(tick, POLL_MS);
    </script>
</body>
</html>
