server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Everything is bind mounted and edited live. Never cache.
    add_header Cache-Control "no-store" always;

    # A viewer address is a path, not a file, so anything missing serves the
    # viewer. A missing .md still 404s through the block below.
    location / {
        try_files $uri /index.html;
    }

    location ~ \.md$ {
        default_type text/markdown;
    }
}
